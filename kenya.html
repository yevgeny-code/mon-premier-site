        <script>
            // 1. On récupère TOUTES les photos du diaporama dans un tableau
            const photos = document.querySelectorAll('.photo-diapo');
            let indexActuel = 0;

            // 2. On lance le minuteur (3000 ms = 3 secondes)
            setInterval(() => {
                // Enlever la classe visible de la photo actuelle
                photos[indexActuel].classList.remove('visible');

                // Calculer le numéro de la photo suivante (et revenir à 0 si on arrive à la fin)
                indexActuel = (indexActuel + 1) % photos.length;

                // Ajouter la classe visible sur la nouvelle photo
                photos[indexActuel].classList.add('visible');
            }, 3000);
        </script>
